name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version to release, e.g. 1.2.3 or 1.2.3-rc.1 (tag will be prefixed with v)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Validate version
        id: version
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $version = $env:RELEASE_VERSION.Trim()
          if ($version.StartsWith('v', [StringComparison]::OrdinalIgnoreCase)) {
            $version = $version.Substring(1)
          }
          $semver = [regex]::Match(
            $version,
            '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$')
          if (-not $semver.Success) {
            throw "Invalid semver: $version"
          }
          if ($semver.Groups[4].Success) {
            foreach ($identifier in $semver.Groups[4].Value.Split('.')) {
              if ($identifier -match '^\d+$' -and $identifier.Length -gt 1 -and $identifier.StartsWith('0')) {
                throw "Invalid semver: numeric prerelease identifiers cannot have leading zeros"
              }
            }
          }
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: dotnet publish src/Fh6Hud/Fh6Hud.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o release-publish

      - name: Package
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE "release-publish"
          if (-not (Test-Path -LiteralPath $dir)) {
            throw "Publish output does not exist: $dir"
          }
          Compress-Archive -Path (Join-Path $dir "*") -DestinationPath "fh6-hud-${{ steps.version.outputs.tag }}-win-x64.zip"

      - name: Create tag
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" `
            --title "${{ steps.version.outputs.tag }}" `
            --generate-notes `
            "fh6-hud-${{ steps.version.outputs.tag }}-win-x64.zip"
